<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b2528">
    <title>Flowz | Live comment wall</title>
    <meta name="description" content="A live wall of approved community replies.">
    <script src="theme.js?v=1"></script>
    <link rel="stylesheet" href="styles.css?v=14">
  </head>
  <body class="wall-page">
    <main class="wall-shell">
      <header class="wall-header">
        <div class="wall-brand" role="img" aria-label="Almajdouie">
          <img class="wall-brand__logo wall-brand__logo--dark" src="assets/almajdouie-white.png" alt="" decoding="async">
          <img class="wall-brand__logo wall-brand__logo--light" src="assets/almajdouie-blue.png" alt="" decoding="async">
        </div>
        <div class="wall-actions">
          <div class="live-status" aria-live="polite">
            <span class="live-dot" aria-hidden="true"></span><span>Live</span><strong id="live-count">0</strong>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <span class="theme-icon theme-icon--sun" aria-hidden="true">&#9728;</span>
            <span class="theme-icon theme-icon--moon" aria-hidden="true">&#9790;</span>
          </button>
        </div>
      </header>

      <section id="wall-stage" class="wall-stage" aria-label="Approved live comments">
        <div class="quote-mark quote-mark--open" aria-hidden="true">“</div>
        <div class="motion-layer" aria-hidden="true">
          <img class="theme-art theme-art--vessel" src="assets/theme/pattern-vessel.png" alt="" decoding="async">
          <img class="theme-art theme-art--dallah" src="assets/theme/pattern-dallah.png" alt="" decoding="async">
          <img class="theme-art theme-art--tree" src="assets/theme/pattern-tree.png" alt="" decoding="async">
          <img class="theme-art theme-art--portrait" src="assets/theme/pattern-portrait.png" alt="" decoding="async">
          <img class="theme-art theme-art--sword" src="assets/theme/pattern-sword.png" alt="" decoding="async">
          <img class="theme-art theme-art--spiral" src="assets/theme/pattern-spiral.png" alt="" decoding="async">
          <div class="partner-logos">
            <img class="partner-logo" src="assets/partners/partner-01.png" alt="" decoding="async" style="--x: 3%; --w: 18vw; --delay: -12s; --duration: 68s; --sway: 28px; --depth: .78;">
            <img class="partner-logo" src="assets/partners/partner-02.png" alt="" decoding="async" style="--x: 27%; --w: 16vw; --delay: -31s; --duration: 76s; --sway: -34px; --depth: .65;">
            <img class="partner-logo" src="assets/partners/partner-03.png" alt="" decoding="async" style="--x: 55%; --w: 21vw; --delay: -49s; --duration: 82s; --sway: 24px; --depth: .82;">
            <img class="partner-logo" src="assets/partners/partner-04.png" alt="" decoding="async" style="--x: 76%; --w: 17vw; --delay: -7s; --duration: 71s; --sway: -26px; --depth: .7;">
            <img class="partner-logo" src="assets/partners/partner-05.png" alt="" decoding="async" style="--x: 14%; --w: 13vw; --delay: -56s; --duration: 79s; --sway: 38px; --depth: .72;">
            <img class="partner-logo" src="assets/partners/partner-06.png" alt="" decoding="async" style="--x: 42%; --w: 18vw; --delay: -21s; --duration: 73s; --sway: -30px; --depth: .88;">
            <img class="partner-logo" src="assets/partners/partner-07.png" alt="" decoding="async" style="--x: 68%; --w: 20vw; --delay: -63s; --duration: 86s; --sway: 32px; --depth: .64;">
            <img class="partner-logo" src="assets/partners/partner-08.png" alt="" decoding="async" style="--x: 5%; --w: 14vw; --delay: -39s; --duration: 69s; --sway: -24px; --depth: .84;">
            <img class="partner-logo" src="assets/partners/partner-09.png" alt="" decoding="async" style="--x: 31%; --w: 17vw; --delay: -4s; --duration: 78s; --sway: 36px; --depth: .68;">
            <img class="partner-logo" src="assets/partners/partner-10.png" alt="" decoding="async" style="--x: 58%; --w: 16vw; --delay: -27s; --duration: 72s; --sway: -38px; --depth: .76;">
            <img class="partner-logo" src="assets/partners/partner-11.png" alt="" decoding="async" style="--x: 79%; --w: 15vw; --delay: -52s; --duration: 84s; --sway: 22px; --depth: .9;">
            <img class="partner-logo" src="assets/partners/partner-12.png" alt="" decoding="async" style="--x: 18%; --w: 15vw; --delay: -17s; --duration: 75s; --sway: -28px; --depth: .66;">
            <img class="partner-logo" src="assets/partners/partner-13.png" alt="" decoding="async" style="--x: 47%; --w: 16vw; --delay: -67s; --duration: 88s; --sway: 30px; --depth: .8;">
            <img class="partner-logo" src="assets/partners/partner-14.png" alt="" decoding="async" style="--x: 72%; --w: 16vw; --delay: -35s; --duration: 74s; --sway: -32px; --depth: .73;">
            <img class="partner-logo" src="assets/partners/partner-15.png" alt="" decoding="async" style="--x: 7%; --w: 12vw; --delay: -24s; --duration: 81s; --sway: 26px; --depth: .86;">
            <img class="partner-logo" src="assets/partners/partner-16.png" alt="" decoding="async" style="--x: 36%; --w: 14vw; --delay: -58s; --duration: 77s; --sway: -36px; --depth: .69;">
            <img class="partner-logo" src="assets/partners/partner-17.png" alt="" decoding="async" style="--x: 62%; --w: 21vw; --delay: -14s; --duration: 85s; --sway: 34px; --depth: .74;">
            <img class="partner-logo" src="assets/partners/partner-18.png" alt="" decoding="async" style="--x: 81%; --w: 19vw; --delay: -44s; --duration: 70s; --sway: -22px; --depth: .83;">
            <img class="partner-logo" src="assets/partners/partner-19.png" alt="" decoding="async" style="--x: 22%; --w: 20vw; --delay: -72s; --duration: 89s; --sway: 40px; --depth: .67;">
            <img class="partner-logo" src="assets/partners/partner-20.png" alt="" decoding="async" style="--x: 52%; --w: 15vw; --delay: -9s; --duration: 80s; --sway: -30px; --depth: .79;">
          </div>
          <span class="motion-logo motion-logo--two"><i>LIVE</i></span>
          <span class="motion-heart"><i></i></span>
          <span class="motion-envelope"><i></i><b></b></span>
        </div>
        <div id="comment-flow" class="comment-flow" aria-live="polite"></div>
        <div id="wall-empty" class="wall-empty" hidden>
          <img src="assets/comment-spark.svg" alt="">
          <p>Waiting for the next approved comment</p>
        </div>
        <div class="quote-mark quote-mark--close" aria-hidden="true">”</div>
      </section>

      <footer class="wall-footer">
        <p id="source-title">Community replies</p>
        <div class="brand-stream" aria-hidden="true">
          <span>APPROVED</span><i></i><span>LIVE</span><i></i><span>COMMUNITY</span>
        </div>
        <time id="last-updated">Connecting...</time>
      </footer>
    </main>
    <script src="public.js?v=9" defer></script>
  </body>
</html>
