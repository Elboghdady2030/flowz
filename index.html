<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b2528">
    <title>Flowz | Live comment wall</title>
    <meta name="description" content="A live wall of approved community replies.">
    <script src="theme.js?v=1"></script>
    <link rel="stylesheet" href="styles.css?v=20">
  </head>
  <body class="wall-page">
    <main class="wall-shell">
      <header class="wall-header">
        <div class="wall-header__campaign">
          <img class="wall-header__prompt" src="assets/header-prompt.png" alt="اكتب كلمة للوطن" decoding="async">
          <img class="wall-header__saudi-day" src="assets/header-saudi-day.png" alt="اليوم الوطني السعودي" decoding="async">
          <img class="wall-header__national" src="assets/header-campaign.png" alt="عزنا بطبعنا" decoding="async">
          <div class="wall-brand" role="img" aria-label="Almajdouie">
            <img class="wall-brand__logo" src="assets/header-almajdouie.png" alt="" decoding="async">
          </div>
        </div>
        <div class="wall-actions">
          <div class="live-status" aria-live="polite">
            <span class="live-dot" aria-hidden="true"></span><span>Live</span><strong id="live-count">0</strong>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <span class="theme-icon theme-icon--sun" aria-hidden="true">&#9728;</span>
            <span class="theme-icon theme-icon--moon" aria-hidden="true">&#9790;</span>
          </button>
        </div>
      </header>

      <section id="wall-stage" class="wall-stage" aria-label="Approved live comments">
        <div class="quote-mark quote-mark--open" aria-hidden="true">“</div>
        <div class="motion-layer motion-layer--managed" aria-hidden="true">
          <img class="theme-art theme-art--vessel" src="assets/theme/pattern-vessel.png" alt="" decoding="async">
          <img class="theme-art theme-art--dallah" src="assets/theme/pattern-dallah.png" alt="" decoding="async">
          <img class="theme-art theme-art--tree" src="assets/theme/pattern-tree.png" alt="" decoding="async">
          <img class="theme-art theme-art--portrait" src="assets/theme/pattern-portrait.png" alt="" decoding="async">
          <img class="theme-art theme-art--sword" src="assets/theme/pattern-sword.png" alt="" decoding="async">
          <img class="theme-art theme-art--spiral" src="assets/theme/pattern-spiral.png" alt="" decoding="async">
          <div class="partner-logos">
            <img class="partner-logo partner-logo--furas" src="assets/partners/partner-furas.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-01.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-02.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-03.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-04.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-05.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-06.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-07.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-08.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-09.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-10.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-11.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-12.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-13.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-14.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-15.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-16.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-17.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-18.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-19.png" alt="" decoding="async">
            <img class="partner-logo" src="assets/partners/partner-20.png" alt="" decoding="async">
          </div>
          <div class="featured-patterns">
            <img class="featured-pattern" src="assets/featured-patterns/feature-01.png" alt="" decoding="async">
            <img class="featured-pattern featured-pattern--wide" src="assets/featured-patterns/feature-02.png" alt="" decoding="async">
            <img class="featured-pattern" src="assets/featured-patterns/feature-03.png" alt="" decoding="async">
            <img class="featured-pattern" src="assets/featured-patterns/feature-04.png" alt="" decoding="async">
            <img class="featured-pattern" src="assets/featured-patterns/feature-05.png" alt="" decoding="async">
            <img class="featured-pattern" src="assets/featured-patterns/feature-06.png" alt="" decoding="async">
            <img class="featured-pattern" src="assets/featured-patterns/feature-07.png" alt="" decoding="async">
          </div>
          <span class="motion-logo motion-logo--two"><i>LIVE</i></span>
          <span class="motion-heart"><i></i></span>
          <span class="motion-envelope"><i></i><b></b></span>
        </div>
        <div id="comment-flow" class="comment-flow" aria-live="polite"></div>
        <div id="wall-empty" class="wall-empty" hidden>
          <img src="assets/comment-spark.svg" alt="">
          <p>Waiting for the next approved comment</p>
        </div>
        <div class="quote-mark quote-mark--close" aria-hidden="true">”</div>
      </section>

      <footer class="wall-footer">
        <p id="source-title">Community replies</p>
        <div class="brand-stream" aria-hidden="true">
          <span>APPROVED</span><i></i><span>LIVE</span><i></i><span>COMMUNITY</span>
        </div>
        <time id="last-updated">Connecting...</time>
      </footer>
    </main>
    <script src="background-flow.js?v=1" defer></script>
    <script src="public.js?v=9" defer></script>
  </body>
</html>
